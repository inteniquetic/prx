[package]
name = "prx"
version = "0.1.0"
edition = "2024"

[lib]
name = "prx"
path = "src/lib.rs"

[[bin]]
name = "prx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
http = "1"
include_dir = "0.7"
notify = "8"
once_cell = "1"
pingora = { version = "0.7", features = ["lb", "openssl"] }
prometheus = "0.14"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustc-hash = "2.1.3"

[dev-dependencies]
bytes = "1"
criterion = { version = "0.8.2", features = ["html_reports"] }
futures-util = "0.3.34"
h2 = "0.4.19"
http = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-tungstenite = "0.30.0"

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "config"
harness = false

# Release build with debug symbols, used by scripts/profile.sh so that
# flamegraphs show real frame names instead of raw addresses.
[profile.profiling]
inherits = "release"
debug = 1

[patch.crates-io]
pingora-core = { path = "vendor/pingora-core" }
pingora-load-balancing = { path = "vendor/pingora-load-balancing" }

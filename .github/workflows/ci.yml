name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Fetch OWASP CRS
        # The pinned release T504 measured. tests/waf_crs.rs loads all of it.
        run: bash bench/waf/fetch-crs.sh

      - name: Test
        # Benches are excluded: criterion has its own harness and rejects
        # libtest flags. Benchmarks run in .github/workflows/perf.yml.
        run: cargo test --lib --bins --tests -- --test-threads=1
        env:
          # Without this the CRS test skips when the checkout is missing; here
          # a missing checkout has to be a failure.
          PRX_REQUIRE_CRS: "1"

      - name: Build benches
        run: cargo build --benches

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security Audit
        run: cargo audit

  schema:
    # docs/openapi.json, docs/prx.schema.json and the WebUI's api.d.ts are all
    # generated from the Rust types. A change to a config or admin payload type
    # that was not followed by `make schema` fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci
        working-directory: webui

      - name: Generated documents and types are current
        run: make schema-check

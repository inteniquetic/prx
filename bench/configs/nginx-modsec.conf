# nginx + ModSecurity v3 for the WAF comparison (docs/WAF-BENCH-PLAN.md).
# Must differ from nginx.conf by the three ModSecurity lines and nothing else:
# that difference is the WAF tax.
#
# nginx reference config for the benchmark harness.
# Equivalent to bench/configs/prx.toml: 4 workers, 2 round-robin upstreams,
# keepalive to upstream, no retries, access log off.

load_module modules/ngx_http_modsecurity_module.so;

worker_processes 4;
worker_rlimit_nofile 65535;
error_log /dev/null crit;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/null crit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    # Request bodies stay in memory. The 16k default spills a 128 KB body to a
    # temp file, which would bill disk I/O to whatever is being compared.
    client_max_body_size 1m;
    client_body_buffer_size 256k;

    # Same pool shape the prx upstream config asks for.
    upstream bench {
        server backend1:8000;
        server backend2:8000;
        keepalive 256;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    server {
        listen 8080 reuseport backlog=4096;
        http2 on;

        modsecurity on;
        modsecurity_rules_file /bench/waf/modsec.conf;

        location /healthz {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://bench;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # No retries, to match max_retries = 0 on the prx side.
            proxy_next_upstream off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_buffering on;
        }
    }
}

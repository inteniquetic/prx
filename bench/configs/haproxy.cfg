# haproxy reference config for the benchmark harness.
# Equivalent to bench/configs/prx.toml: 4 threads, 2 round-robin backends,
# keepalive to backend, no retries, logging off.

global
    nbthread 4
    # 2 FDs per proxied connection must fit the container ulimit (65535).
    maxconn 30000
    # No log directive: logging is off for every target in the comparison.

defaults
    mode http
    timeout connect 1s
    timeout client  30s
    timeout server  5s
    timeout http-keep-alive 60s
    option http-keep-alive
    retries 0

frontend fe_bench
    bind :8080
    default_backend be_bench

backend be_bench
    balance roundrobin
    http-reuse always
    server b1 backend1:8000 maxconn 4096
    server b2 backend2:8000 maxconn 4096

# The one SecLang engine config every WAF target loads. Only directives that
# ModSecurity v3, Coraza and prx all implement belong here; anything an engine
# needs beyond this goes in DEVIATIONS.md, not in this file.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 262144
SecRequestBodyNoFilesLimit 262144
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine Off
SecDebugLogLevel 0
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

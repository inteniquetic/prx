<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PRX Proxy</title>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrors src/lib/stores/theme.ts; keep the key and the values in step.
      (function () {
        try {
          var stored = localStorage.getItem('prx-theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          // Blocked storage: fall back to the OS setting only.
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-D3E88c0v.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-AYeRZI3Q.css">
  </head>
